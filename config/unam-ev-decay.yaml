name: unam-ev-decay

download:
  target: na-unam
  start: "2025-11-11T10:04:20+00:00"
  duration_min: 1.2
  n_files: 1

catalogue:
  filter_elevation_deg: 5.0
  min_flux: 100.0
  subtract_unmodelled: true
  fix_solar_system: true
  keep_sources: ['sun']

measurement_set:
  reuse_existing: false

calibration:
  mode: auto
  minsnr: 2.0
  solint: inf
  applymode: calonly

imaging:
  nvis: 4000
  fov: 170deg
  res: 1.0deg
  healpix: true
  lasso: true
  alpha: 0.006
  l1_ratio: 0.02

significance:
  null_trials: 400
  null_percentile: 99.0
  trials_null_samples: 20000
  false_alarm_rate: 0.01

search:
  source_finder_sigma: 5.0
  time_windows: [1, 2, 4, 8]
  refine_positions: true
  window_map:
    enabled: true
    n_side: 110
    n_windows: 6
    n_peaks: 40
