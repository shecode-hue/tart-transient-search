# Run configuration — za-hammanskraal
name: za-hammanskraal

download:
  target: za-hammanskraal      
  start: "2026-08-24T06:08:29+00:00"                
  duration_min: 2
  n_files: 1                   

catalogue:
  filter_elevation_deg: 5.0    
                               
  min_flux: 100.0
  # modelled but NOT subtracted, e.g. ['sun']
  keep_sources: []
  # subtract the Sun and EGNOS/SDCM payloads that
  # tart2ms's name filter drops, rather than only vetoing them
  subtract_unmodelled: true

measurement_set:
  # true skips tart2ms if the MS already exists -- for re-analysis
  reuse_existing: false

calibration:

  mode: auto                   # auto | always | never
  minsnr: 2.0                 
  solint: inf
  applymode: calonly          

imaging:
  nvis: 4000
  fov: 170deg
  res: 1.0deg
  healpix: true
  lasso: true
  alpha: 0.006
  l1_ratio: 0.02

significance:
  null_trials: 400             
  null_percentile: 99.0
  trials_null_samples: 20000    
  false_alarm_rate: 0.01      

search:
  source_finder_sigma: 5.0
  # search these fractions of the observation, best of
  time_windows: [1, 2, 4, 8]
  window_map:
    # image each time window and keep the pixel-wise max,
    # so a source that brightens mid-observation still
    # produces a position to test
    enabled: true
    n_side: 110
    n_windows: 6
    n_peaks: 40     
